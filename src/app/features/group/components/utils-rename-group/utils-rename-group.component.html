<app-modal-utils-chat>
     <i modal-btn class="fa-solid fa-pen text-black"></i>
  <h2 modal-header>Rename Group</h2>
  <div modal-body>
    <span class="mb-3 fw-medium" style="display: inline-block; font-size: 20px"
      >Name</span
    >
    <input
      class="form-control"
      type="text"
      name="name"
      style="padding: 12px"
      placeholder="Enter name group..."
      [formControl]="nameGroup"
    />
    <div class="text-end">
      <button class="btn btn-primary mt-3" (click)="handlRenameGroup()">Rename</button>
    </div>
  </div>
</app-modal-utils-chat>
