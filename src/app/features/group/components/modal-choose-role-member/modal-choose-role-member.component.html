<ng-template #content let-modal class="modal">
  <div class="modal-header">
    <div class="d-flex justify-content-between align-items-center w-100">
      <div class="d-flex align-items-center gap-2">
        <button
          type="button"
          class="btn-close"
          aria-label="Close"
          (click)="modal.dismiss('Cross click')"
        ></button>
        <h4 class="mb-0">Choose Admin For Group</h4>
      </div>
      <span
        [ngClass]="user ? 'text-primary cursor-pointer' : 'btn-choose'"
        (click)="handleChooseAdmin()"
        >Choose</span
      >
    </div>
  </div>
  <div class="modal-body">
    <div
      class="d-flex card-search align-items-center mb-4 border rounded gap-2"
      style="padding: 15px"
    >
      <i class="fa-solid fa-magnifying-glass"></i>
      <input
        type="text"
        class="border-0 flex-fill"
        placeholder="Search user..."
        [formControl]="nameUser"
      />
    </div>
    <div class="d-flex flex-column gap-3 mt-2">
      <fieldset>
        <ng-container *ngFor="let user of listUserByGroup">
          <label
            class="custom-checkbox-wrapper d-flex align-items-center justify-content-between py-2 px-3"
          >
            <div class="d-flex align-items-center gap-2">
              <img
                src="https://images.unsplash.com/photo-1631913290783-490324506193?q=80"
                alt=""
                class="card-avatar"
              />
              <span class="fw-bold">{{ user.username }}</span>
            </div>
            <input
              #userCheckbox
              type="radio"
              name="chooseAdmin"
              [checked]="isUserSelected(user._id)"
              (change)="handleOpenModal(user, $event)"
            />
          </label>
        </ng-container>
      </fieldset>
    </div>
  </div>
</ng-template>

<span
  modal-btn
  class="text-danger fw-normal w-100 d-inline-block cursor-point d-flex align-items-center gap-2 justify-content-center"
  (click)="handleLeaveGroup(content)"
>
  <i class="fa-solid fa-arrow-right-from-bracket"></i>
  Leave Group
</span>
