<div class="p-3">
  <modal-create>Create Heroes</modal-create>
  <h2 class="text-center fs-4 mb-2 pt-2">{{ "my heroes" | capitalizeWords }}</h2>

  <div
    *ngIf="selectedHeroIds.length > 0"
    class="d-flex justify-content-between gap-4 align-items-center px-3 my-3"
  >
    <div class="d-flex gap-5">
      <label class="fs-6 text-gray align-items-center fw-bold d-flex gap-2">
        <input
          type="checkbox"
          [checked]="selectAll"
          (change)="toggleSelectAll($event)"
        />
        <span> {{ selectedHeroIds.length }} selected </span>
      </label>

      <app-dropdownlable
        #dropdownComponent
        [heroSelectLengt]="selectedHeroIds.length"
        [selectedHeroIds]="selectedHeroIds"
        [tags]="tags"
        (tagsSelected)="handleAddTagsToSelectedHeroes($event)"
      >
        <div class="d-flex gap-1 align-items-center label cursor-point">
          <i class="fa-solid fa-tags"></i>
          <span>Add Tag</span>
        </div>
      </app-dropdownlable>

      <div
        class="d-flex gap-1 align-items-center label cursor-point"
        (click)="handleRemoveAllTag()"
      >
        <i class="fa-solid fa-xmark"></i>
        <span>Remove Tags</span>
      </div>
    </div>

    <button
      class="btn btn-danger"
      [disabled]="selectedHeroIds.length === 0"
      (click)="handleDeleteSelected()"
    >
      <i class="fa-regular fa-trash-can"></i>
      Delete
    </button>
  </div>

  <div *ngIf="isLoading && heroes.length === 0 " class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden"></span>
    </div>
  </div>

  <div
    *ngIf="!this.isLoading && heroes.length === 0"
    class="empty-state-container text-center"
  >
    <div class="empty-icon-wrapper">
      <i class="fa-brands fa-odysee empty-icon display-1"></i>
    </div>
    <p class="empty-message">No heroes found. Please Create Hero.</p>
  </div>

  <div
    *ngIf="heroes.length > 0"
    class="heroes-list d-flex flex-column gap-3"
  >
    <div class="heroes-wrapper">
      <div *ngFor="let hero of heroes">
        <app-hero-card
          [hero]="hero"
          [checked]="selectedHeroIds.includes(hero._id!)"
          [showCheckbox]="true"
          [navigateDetail]="true"
          (checkboxChange)="handleSelectHero($event.id, $event.checked)"
        >
        </app-hero-card>
      </div>
    </div>
  </div>
</div>
