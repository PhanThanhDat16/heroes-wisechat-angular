<div
  [routerLink]="navigateDetail === true ? ['/heroes', hero._id] : null"
  class="card shadow-sm rounded-4 p-3 position-relative border-0 h-100 text-center text-primary-2 cardHero-item cursor-point"
>
  <input
    *ngIf="showCheckbox"
    type="checkbox"
    class="form-check-input position-absolute hero-checkbox"
    (click)="$event.stopPropagation()"
    [checked]="checked"
    (change)="onCheckboxChange($event)"
  />

  <img
    src="https://images.unsplash.com/photo-1728577740843-5f29c7586afe?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
    class="card-img-top mx-auto cardHero-img mt-2"
    alt="Avatar"
  />

  <div class="card-body p-2 d-flex flex-column gap-2">
    <h5 class="card-title fw-semibold border-bottom pb-2 text-secondary">
      {{ hero.name }}
    </h5>
    <div class="d-flex justify-content-center gap-1 small text-muted">
      <span>Age: {{ hero.age }}</span>
      <span>• {{ hero.gender }}</span>
    </div>
    <div class="text-secondary small">{{ hero.mail }}</div>
    <div class="text-muted small">{{ hero.address }}</div>

    <div class="tag-list">
      <span
        *ngFor="let tag of hero.tags; let i = index"
        class="tag-item"
        [ngStyle]="{
          'background-color': colorPalette[i % colorPalette.length].background,
          color: colorPalette[i % colorPalette.length].color
        }"
      >
        {{ tag }}
      </span>
    </div>
  </div>
</div>
