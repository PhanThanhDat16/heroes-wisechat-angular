<ng-container *ngIf="uploaded">
  <div class="uploaded-images-preview mb-2 px-5">
    <div class="d-flex flex-nowrap gap-2 overflow-auto">
      <div class="image-item position-relative rounded shadow-sm">
        <ng-container [ngSwitch]="getFileType(uploaded.mimetype)">
          <img
            *ngSwitchCase="'image'"
            [src]="uploaded.url"
            [alt]="uploaded.originalname"
            class="preview-img"
          />

          <img
            *ngSwitchCase="'excel'"
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTroU91FLk1e5CTmveZCstER9A-qLpJGNtZvA&s"
            alt="Excel file"
            class="preview-img"
          />

          <img
            *ngSwitchCase="'word'"
            src="https://thehanoichamomile.com/wp-content/uploads/2019/06/12-121390_new-microsoft-word-icon.jpg"
            alt="Word file"
            class="preview-img"
          />

          <div
            *ngSwitchDefault
            class="w-100 h-100 d-flex justify-content-center align-items-center bg-light text-secondary"
          >
            File
          </div>
        </ng-container>

        <div class="image-filename">
          {{ uploaded.originalname }}
        </div>

        <button
          type="button"
          (click)="removeImage()"
          class="btn btn-sm btn-danger position-absolute top-0 end-0 m-1 py-0 px-2"
        >
          ×
        </button>
      </div>
    </div>
  </div>
</ng-container>

<div class="input-message position-relative bg-white mt-auto">
  <div *ngIf="replyToMessage" class="reply">
    <span class="reply-close" (click)="this.replyToMessage = null">
      <i class="fa-solid fa-xmark"></i>
    </span>
    <span class="text-truncate d-block" style="width: 97%">{{
      replyToMessage.content
    }}</span>
  </div>

  <div *ngIf="editToMessage" class="position-absolute edit-message">
    <span>Edit Message</span>
    <span class="edit-close" (click)="handleCloseEdit()"
      ><i class="fa-solid fa-xmark"></i
    ></span>
  </div>

  <div class="d-flex gap-3 align-items-center form-control me-2 py-3">
    <label for="file-upload" class="mb-0 cursor-pointer" *ngIf="!editToMessage">
      <input
        type="file"
        id="file-upload"
        hidden
        (change)="handleChooseFileAndImage($event)"
      />
      <i class="fa-solid fa-paperclip"></i>
    </label>

    <input
      placeholder="Type message..."
      class="border-0 flex-fill"
      [(ngModel)]="messageInput"
    />

    <button (click)="handleSendMessage()">
      <i
        class="fa-solid fa-paper-plane fs-5 btn-send"
        style="color: #1b93ee"
      ></i>
    </button>
  </div>
</div>
