<div *ngFor="let msg of messagesGroup; let index = index">
  <div
    *ngIf="getDateAndTimeStamp(msg, index) !== null"
    class="text-center py-3"
    style="color: #ccc"
  >
    {{ getDateAndTimeStamp(msg, index) | smartDate }}
  </div>

  <div
    class="message mb-2 d-flex position-relative"
    [ngClass]="
      msg.senderId === userId ? 'justify-content-end' : 'justify-content-start'
    "
  >
    <div
      class="d-flex align-items-center"
      [ngClass]="{ 'justify-content-end': msg.senderId === userId }"
    >
      <div
        *ngIf="msg.senderId !== userId"
        [ngClass]="onlineUserIds.includes(msg.senderId) ? 'avatar-online' : ''"
      >
        <img
          class="card-avatar"
          src="https://images.unsplash.com/photo-1728887823143-d92d2ebbb53a?q=80&w=2080..."
          alt=""
        />
      </div>

      <div class="d-flex flex-column gap-1 flex-fill">
        <span *ngIf="msg.senderId !== userId" class="text-name">{{
          msg.senderName | capitalizeWords
        }}</span>
        <div
          [ngClass]="msg.senderId !== userId ? 'f-row' : 'f-row-reverse'"
          class="text-wrapper d-flex align-items-center gap-3"
        >
          <div placement="top" [ngbTooltip]="msg.createdAt | formatTime">
            <p
              [ngClass]="{
                'bg-primary text-white align-self-end': msg.senderId === userId,
                'bg-customer text-dark align-self-start':
                  msg.senderId !== userId
              }"
              *ngIf="msg.type === 'text' && !msg.replyToMessageId"
              class="mb-0 text-message fs-6 text-content message-item"
            >
              {{ msg.content }}
            </p>

            <div *ngIf="msg.replyToMessageId" class="">
              <span class="reply-text">{{ msg.replyToContent }}</span>
              <p [ngClass]="{
                'bg-primary text-white align-self-end': msg.senderId === userId,
                'bg-customer text-dark align-self-start':
                  msg.senderId !== userId
              }" *ngIf="msg.type === 'text'" class="mb-0 text-message fs-6 text-content message-item">
                {{ msg.content }}
              </p>
            </div>

          <div

            class="text-react d-flex gap-3"
          >
            <span class="cursor-point" (click)="handleReply(msg)">
              <i class="fa-solid fa-share"></i>
            </span>
            <span class="cursor-point">
              <i class="fa-solid fa-face-smile"></i>
            </span>
            <span class="cursor-point">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

<div
  *ngIf="selectedImageUrl"
  class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center bg-dark bg-opacity-75"
  style="z-index: 1050"
  (click)="selectedImageUrl = null"
>
  <img
    [src]="selectedImageUrl"
    class="img-fluid rounded shadow"
    style="max-height: 90vh; max-width: 90vw"
    alt="Large Image"
    (click)="$event.stopPropagation()"
  />
</div>
