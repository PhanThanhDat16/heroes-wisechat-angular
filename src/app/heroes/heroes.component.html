<h2 class="text-center fs-4 mb-2">{{ "my heroes" | capitalizeWords }}</h2>

<div class="d-flex justify-content-between align-items-center px-3">
  <div>
    <label>
      <input type="checkbox" [checked]="selectAll" (change)="toggleSelectAll($event)" />
      Select All
    </label>
  </div>
  <button class="btn btn-danger" [disabled]="selectedHeroIds.length === 0" (click)="handleDeleteSelected()">
    Delete Selected ({{ selectedHeroIds.length }})
  </button>
</div>

<div class="heroes-list p-3 d-flex flex-column gap-3">
  <div class="heroes-wrapper">
    <div *ngFor="let hero of heroes">
      <app-hero-card 
        [hero]="hero" 
        [checked]="selectedHeroIds.includes(hero._id!)"
        [showCheckbox]="true"
        (checkboxChange)="handleSelectHero($event.id, $event.checked)">
      </app-hero-card>
    </div>
  </div>
</div>
